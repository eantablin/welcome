<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>2048 — emanuel.antablin.com</title>
  <meta name="description" content="A black-and-white brutalist 2048 tile puzzle. Installable, offline-capable.">
  <meta name="robots" content="noai, noimageai">
  <meta name="theme-color" content="#ffffff">

  <!-- PWA: iOS standalone + icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="2048">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="manifest" href="manifest.webmanifest">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="main">
    <header class="hud">
      <span class="hud__brand">2048</span>
      <span class="hud__score hud__score--chip" id="score">0</span>
      <span class="hud__best" id="best">BEST&nbsp;0</span>
    </header>

    <div class="stage-wrap">
      <div id="board" class="board" aria-label="2048 game board"></div>

      <!-- overlay: start / win / game over — brutalist inverted panel -->
      <div class="overlay" id="overlay">
        <div class="overlay__panel">
          <h1 class="overlay__title" id="overlayTitle">2048</h1>
          <p class="overlay__sub" id="overlaySub">ARROWS / SWIPE TO MOVE</p>
          <p class="overlay__score" id="overlayScore" hidden></p>
          <p class="overlay__install" id="installHint" hidden>
            iOS: SHARE → <strong>ADD TO HOME SCREEN</strong> — plays offline.
          </p>
          <button class="btn btn--primary" id="startBtn" type="button">PRESS START</button>
          <button class="btn btn--ghost" id="continueBtn" type="button" hidden>KEEP GOING</button>
        </div>
      </div>
    </div>

    <p class="hint" id="hint">MERGE EQUAL TILES · REACH 2048</p>

    <footer class="foot">
      <a href="https://emanuel.antablin.com">◄ BACK TO EMANUEL.ANTABLIN.COM</a>
      <button class="foot__sound" id="soundBtn" type="button" aria-pressed="false">SOUND: OFF</button>
    </footer>
  </main>

  <script src="game.js"></script>
</body>
</html>
