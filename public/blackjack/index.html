<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>BRUTAL 21 — emanuel.antablin.com</title>
  <meta name="description" content="A black-and-white brutalist blackjack. Installable, offline-capable.">
  <meta name="robots" content="noai, noimageai">
  <meta name="theme-color" content="#ffffff">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="BRUTAL 21">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="manifest" href="manifest.webmanifest">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="main">
    <header class="hud">
      <span class="hud__brand">BRUTAL&nbsp;21</span>
      <span class="hud__chip" id="bankroll">$100</span>
    </header>

    <section class="table" id="table">
      <div class="row">
        <span class="row__label">DEALER</span>
        <div class="cards" id="dealerCards"></div>
        <span class="row__total" id="dealerTotal" hidden></span>
      </div>

      <p class="table__msg" id="msg">PLACE YOUR BET</p>

      <div class="row">
        <span class="row__label">YOU</span>
        <div class="cards" id="playerCards"></div>
        <span class="row__total" id="playerTotal" hidden></span>
      </div>
    </section>

    <section class="controls">
      <div class="controls__bet" id="betControls">
        <button class="btn btn--ghost" id="betMinus" type="button">−$5</button>
        <span class="controls__amount" id="betAmount">$10</span>
        <button class="btn btn--ghost" id="betPlus" type="button">+$5</button>
        <button class="btn" id="dealBtn" type="button">DEAL</button>
      </div>
      <div class="controls__play" id="playControls" hidden>
        <button class="btn" id="hitBtn" type="button">HIT</button>
        <button class="btn" id="standBtn" type="button">STAND</button>
        <button class="btn" id="doubleBtn" type="button">DOUBLE</button>
      </div>
      <p class="controls__instalhint" id="installHint" hidden>
        iOS: SHARE → <strong>ADD TO HOME SCREEN</strong> — plays offline.
      </p>
    </section>

    <footer class="foot">
      <a href="https://emanuel.antablin.com">◄ BACK TO EMANUEL.ANTABLIN.COM</a>
      <button class="foot__sound" id="soundBtn" type="button" aria-pressed="false">SOUND: OFF</button>
    </footer>
  </main>

  <script src="game.js"></script>
</body>
</html>
